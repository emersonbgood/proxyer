<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Proxy</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f4f4f9; }
        .container { text-align: center; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="text"] { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h1>Web Proxy</h1>
    <!-- This form submits directly to CroxyProxy's search endpoint -->
    <form action="https://croxyproxy.com" method="POST">
        <input type="text" name="url" placeholder="Enter URL (e.g., https://google.com)" required>
        <button type="submit">Go</button>
    </form>
    <p><small>Powered by <a href="https://www.croxyproxy.com" target="_blank">CroxyProxy</a></small></p>
</div>

</body>
</html>
